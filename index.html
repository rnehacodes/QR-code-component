<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Frontend Mentor | QR code component</title>
    <style>
      * {
        font-family: "Poppins", sans-serif;
      }
      body {
        background-color: #d5e1ef;
      }
      .card {
        background-color: white;
        border-radius: 15px;
        height: 35%;
        width: 20%;
        margin: 7.5% 40% 7.5% 40%;
        padding-bottom: 10px;
      }
      .qrcode > img {
        width: 90%;
        margin: 5%;
        border-radius: 15px;
        padding: 0%;
      }
      .text {
        margin-top: 0;
        margin-left: 20px;
        margin-right: 20px;
        text-align: center;
      }
      .card > p {
        font-size: small;
        color: #9b9aa0;
      }
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="qrcode"><img src="./images/image-qr-code.png" /></div>
      <h3 class="text">Improve your front-end skills by building projects</h3>
      <p class="text">
        Scan the QR code to visit Frontend Mentor and take your coding skills to
        <br />
        the next level
      </p>
    </div>
    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="https://github.com/rnehacodes">Neha Rajput</a>.
    </div>
  </body>
</html>
